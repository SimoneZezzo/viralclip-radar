[project]
name = "viralclip-radar"
version = "0.1.0"
description = "Prospective Twitch clip discovery and view-count snapshot collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
viralclip = "viralclip.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viralclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
